# sysc-greet mango greeter config — used ONLY by the greetd greeter session
# greetd runs: mango -c /etc/greetd/mango-greeter-config.conf -s /etc/greetd/mango-greeter-session.sh
#
# INVARIANT: this file must never source /etc/mango/config.conf and must contain
# no bind=/mousebind=/axisbind= lines. Default mango binds spawn a terminal and quit.
# mango itself always adds Ctrl+Alt+F1-F12 VT switching; nothing else is reachable.

animations=0
blur=0
shadows=0
border_radius=0
borderpx=0
xwayland_persistence=0
sloppyfocus=0
warpcursor=0
cursor_hide_timeout=1
cursor_hide_on_keypress=1

# Keyboard layout for the greeter (also xkb_rules_variant, xkb_rules_options)
xkb_rules_layout=us

windowrule=isfullscreen:1,isnoborder:1,isnoanimation:1,appid:kitty

# gSlapper wallpaper daemon (wlr-layer-shell). The greeter UI is started by -s.
exec-once=cd /var/lib/greeter && env HOME=/var/lib/greeter XDG_CACHE_HOME=/var/lib/greeter/.cache XDG_CONFIG_HOME=/var/lib/greeter/.config XDG_STATE_HOME=/var/lib/greeter/.local/state /usr/local/bin/sysc-greet --wallpaper-daemon

# No bind/mousebind/axisbind lines on purpose
