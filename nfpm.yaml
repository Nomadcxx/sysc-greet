name: sysc-greet
arch: amd64
platform: linux
version: ${VERSION}
section: misc
priority: optional
maintainer: Nomadcxx <noovie@gmail.com>
description: |
  Graphical console greeter for greetd with ASCII art and themes.
  Supports Niri, Cagebreak, Sway, Mango, and Hyprland 0.55+ (opt-in).
vendor: Nomadcxx
homepage: https://github.com/Nomadcxx/sysc-greet
license: GPL-3.0-only AND MIT AND CC0-1.0 AND CC-BY-4.0 AND CC-BY-NC-4.0 AND CC-BY-SA-4.0 AND CC-BY-NC-SA-4.0

contents:
  # Main binary
  - src: ./sysc-greet
    dst: /usr/local/bin/sysc-greet
    file_info:
      mode: 0755

  # ASCII configs
  - src: ./ascii_configs/
    dst: /usr/share/sysc-greet/ascii_configs/
    type: tree

  # Border assets (also embedded in the binary)
  - src: ./cmd/sysc-greet/assets/borders/
    dst: /usr/share/sysc-greet/borders/
    type: tree

  # Third-party license notices for embedded animation assets
  - src: ./THIRD_PARTY_NOTICES.md
    dst: /usr/share/sysc-greet/THIRD_PARTY_NOTICES.md
    file_info:
      mode: 0644

  # Wallpapers
  - src: ./wallpapers/
    dst: /usr/share/sysc-greet/wallpapers/
    type: tree

  # Bundled themes
  - src: ./themes/
    dst: /usr/share/sysc-greet/themes/
    type: tree

  # Fonts
  - src: ./fonts/
    dst: /usr/share/sysc-greet/fonts/
    type: tree

  # Kitty config
  - src: ./config/kitty-greeter.conf
    dst: /etc/greetd/kitty.conf
    file_info:
      mode: 0644

  # Niri config
  - src: ./config/niri-greeter-config.kdl
    dst: /etc/greetd/niri-greeter-config.kdl
    file_info:
      mode: 0644

  # Opt-in Hyprland 0.55+ Lua config
  - src: ./config/hyprland-greeter-config.lua
    dst: /etc/greetd/hyprland-greeter-config.lua
    file_info:
      mode: 0644

  # Hyprland legacy config (for older distros)
  - src: ./config/hyprland-greeter-config-legacy.conf
    dst: /etc/greetd/hyprland-greeter-config.conf
    file_info:
      mode: 0644

  # Sway config
  - src: ./config/sway-greeter-config
    dst: /etc/greetd/sway-greeter-config
    file_info:
      mode: 0644

  # Cagebreak greeter config
  - src: ./config/cagebreak-greeter-config
    dst: /etc/greetd/cagebreak-greeter-config
    file_info:
      mode: 0644

  # Mango greeter config + session script (mango itself: mangowm package)
  - src: ./config/mango-greeter-config.conf
    dst: /etc/greetd/mango-greeter-config.conf
    file_info:
      mode: 0644
  - src: ./config/mango-greeter-session.sh
    dst: /etc/greetd/mango-greeter-session.sh
    file_info:
      mode: 0755

  # Polkit rule for greeter shutdown/reboot
  - src: ./config/85-greeter.rules
    dst: /etc/polkit-1/rules.d/85-greeter.rules
    file_info:
      mode: 0644

  # Directories (empty, will be populated at runtime)
  - dst: /var/cache/sysc-greet
    type: dir
  - dst: /var/lib/greeter/Pictures/wallpapers
    type: dir

scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
